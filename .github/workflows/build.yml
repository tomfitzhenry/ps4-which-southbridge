name: build

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install binutils
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends binutils
      - name: Build
        run: make
      - name: Show artifact
        run: |
          file which-southbridge.bin
          xxd -l 16 which-southbridge.bin
      - uses: actions/upload-artifact@v4
        with:
          name: which-southbridge.bin
          path: which-southbridge.bin
